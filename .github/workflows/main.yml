name: win 11

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

env:
  RDP_USER: santanu
  RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
  TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

    steps:
      - name: Configure RDP (NLA left enabled)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          # Only allow Tailscale address range
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP user
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "RDP_PASSWORD secret is missing"
            exit 1
          }
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (-not (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $env:RDP_USER -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER
          # Uncomment only if you need admin rights:
          # Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=$env:TS_AUTHKEY `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned"
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP port
        run: |
          $t = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $t.TcpTestSucceeded) {
            Write-Error "RDP port 3389 not reachable"
            exit 1
          }
          Write-Host "RDP reachable"

      - name: Keep alive
        run: |
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: (your RDP_PASSWORD secret)"
          while ($true) {
            Write-Host "[$(Get-Date)] RDP active. Cancel the workflow to stop."
            Start-Sleep -Seconds 300
          }
